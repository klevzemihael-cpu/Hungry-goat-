<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0E0E0E}iframe{border:0;display:block}</style></head>
<body>
<script>
  const q=new URLSearchParams(location.search);
  const f=document.createElement("iframe");
  f.src=q.get("src"); f.width=q.get("w")||390; f.height=q.get("h")||12000;
  document.body.appendChild(f);
</script>
</body></html>
